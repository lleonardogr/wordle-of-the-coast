name: Atualizar dados de cartas

on:
  schedule:
    # Toda segunda-feira às 06:00 UTC — pega lançamentos/erratas recentes do Scryfall.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Buscar cartas no Scryfall
        run: node scripts/fetch-cards.mjs

      - name: Commitar mudanças (se houver)
        run: |
          if git diff --quiet -- data/cards.json; then
            echo "Nenhuma mudança nos dados das cartas."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cards.json
          git commit -m "chore(data): atualizar dados de cartas do Scryfall"
          git push
