name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Mantém um PR "chore(main): release X.Y.Z" com o CHANGELOG acumulado a
      # partir dos Conventional Commits; o merge desse PR cria a tag e a release.
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
