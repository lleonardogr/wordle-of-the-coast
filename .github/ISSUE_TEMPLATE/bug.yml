name: Bug
description: Algo no jogo não funciona como deveria
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: O que aconteceu
      description: E o que você esperava que acontecesse.
    validations:
      required: true
  - type: input
    id: puzzle
    attributes:
      label: Número do puzzle e modo
      placeholder: "#12, difícil"
  - type: textarea
    id: steps
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Abrir o modo fácil
        2. Digitar ...
  - type: input
    id: env
    attributes:
      label: Navegador e dispositivo
      placeholder: "Safari, iPhone 15"
